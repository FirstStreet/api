"""
Directs the executor to defer this fragment when the `if` argument is true or undefined.
"""
directive @defer(
  """Deferred when true or undefined."""
  if: Boolean = true

  """Unique name"""
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

directive @fsApplyExclusion on FIELD_DEFINITION

directive @fsHasPolicy(service: Service!) on FIELD_DEFINITION | ARGUMENT_DEFINITION

directive @fsRecordAPIUsage(service: APIUsageService!) on INPUT_FIELD_DEFINITION | FIELD_DEFINITION

directive @fsRequiresVintage(fromVintage: Int64!, toVintage: Int64) on FIELD_DEFINITION

directive @fsValidation(constraint: String!) on INPUT_FIELD_DEFINITION | ARGUMENT_DEFINITION | FIELD_DEFINITION

directive @goField(forceResolver: Boolean, name: String) on INPUT_FIELD_DEFINITION | FIELD_DEFINITION

enum APIUsageService {
  LOCALITY
  PLACE
  GEOSPATIAL
  FLOOD
  FIRE
  HEAT
  COLD
  WIND
  AIR
  DROUGHT
  HAIL
  PRIMARY_PERIL
  MACROECONOMIC
  ALL_PERIL
}

type Adaptation {
  """The type of adaptation."""
  type: AdaptationType!

  """The display name of the adaptation."""
  name: String!

  """The perils associated with the adaptation."""
  peril: [AdaptationPeril!]!

  """The annual cost of the adaptation."""
  annualCost: Int64

  """The setup cost of the adaptation."""
  setupCost: Int64

  """The AAL (Average Annual Loss) associated with the adaptation."""
  aal: [AdaptationAAL!]

  """Payback period information for the adaptation."""
  paybackYears: [PaybackYears!]

  """
  The mechanism slot this adaptation occupies. Adaptations within a mechanism
  are mutually exclusive.
  """
  mechanism: AdaptationMechanism!

  """
  The user-facing measure group this adaptation belongs to. Parameter variants
  of the same measure (e.g. flood-barrier heights) share a group.
  """
  group: AdaptationGroup!
}

type AdaptationAAL {
  """
  Percentile value for estimates, one of: 10, 50, 90. 10th percentile estimate is low value, 90th percentile is high value, and 50th is mean.
  """
  percentile: Int

  """Year, as relative to the current year."""
  relativeYear: Int

  """The savings on investment due to the adaptation."""
  adaptationSOI: Int64

  """The savings on investment as a percentage of the adaptation cost."""
  adaptationSOIPct: Float

  """
  The cumulative difference in average annual cash loss due to the adaptation.
  """
  cashLossCumulativeDiff: Int64

  """
  The cumulative difference in average annual cash loss as a percentage of the total rebuild cost.
  """
  cashLossCumulativeDiffPct: Float
}

"""
User-facing adaptation measure group. Parameter variants of the same measure
(e.g. flood-barrier heights) share a group. Distinct from AdaptationMechanism.
"""
enum AdaptationGroup {
  """Flood Barriers (1–8 ft variants)"""
  FLOOD_BARRIER

  """Dry Floodproofing (1–10 ft variants)"""
  DRY_FLOODPROOFING

  """Wet Floodproofing (finished/unfinished-basement variants)"""
  WET_FLOODPROOFING

  """Raised Foundation (1–10 ft variants)"""
  RAISED_FOUNDATION

  """Retaining Walls (1–4 ft variants)"""
  RETAINING_WALLS

  """Drainage Improvements (1–6 ft variants)"""
  DRAINAGE_IMPROVEMENTS

  """Elevation of Critical Equipment & Utilities"""
  ELEVATION_OF_CRITICAL_EQUIPMENT

  """Wind Design Standard upgrades"""
  WIND_DESIGN_STANDARD

  """Replace with Metal Roof"""
  ROOF_TYPE_TO_METAL

  """Fire Proofing"""
  FIRE_PROOFING

  """Defensible Space"""
  DEFENSIBLE_SPACE

  """Onsite Fire Suppression"""
  ONSITE_FIRE_SUPPRESSION

  """
  Fire-Resistant Exterior Materials (roof / wall / eaves & openings components)
  """
  FIRE_RESISTANT_EXTERIOR
}

"""
Adaptation mechanism. Each mechanism should only have one adaptation applied.
"""
enum AdaptationMechanism {
  """
  Perimeter barriers / dry floodproofing / retaining walls / drainage — block water at the structure boundary
  """
  FLOOD_PERIMETER_BARRIER

  """Raised foundations — elevate the building above water"""
  FLOOD_FOUNDATION

  """Wet floodproofing — interior/structural waterproofing"""
  FLOOD_STRUCTURE_WATERPROOF

  """Equipment elevation — raise critical equipment above flood level"""
  FLOOD_EQUIPMENT

  """Building envelope design standard upgrades for wind resistance"""
  WIND_DESIGN_STANDARD

  """Fire-resistant envelope materials"""
  FIRE_PROOFING

  """Non-combustible roof cover materials"""
  FIRE_ROOF_COVER

  """Defensible space landscaping"""
  FIRE_DEFENSIBLE_SPACE

  """Non-combustible construction materials"""
  FIRE_CONSTRUCTION

  """Onsite fire suppression systems"""
  FIRE_SUPPRESSION
}

enum AdaptationPeril {
  FLOOD
  WILDFIRE
  WIND
}

