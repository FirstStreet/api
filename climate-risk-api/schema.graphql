"""
A past tropical cyclone whose wind swath covered the place. Unlike wildfires this is coverage
rather than proximity, so a place just outside the weakest swath band returns nothing at all.
Only about a fifth of storm tracks carry a wind swath, so the rest can never be returned.
"""
type HistoricCyclone {
  """Identifies the storm within its historic cyclone version."""
  cycloneId: Int!

  """IBTrACS storm identifier, e.g. 2003239N16309."""
  ibtracsSid: String!

  """Readable name of the storm, as IBTrACS reports it."""
  name: String

  """
  IBTrACS season the storm belongs to, which can differ from the calendar year of individual
  observations. Cyclones carry no event date.
  """
  season: Int!

  """
  Sustained wind speed band of the swath covering this place, in mph: 39, 58 or 74. Bands do not
  overlap, so this is the strongest band covering the place rather than a peak gust reading.
  """
  windSpeedBandMph: Int!

  """
  Peak category over the whole life of the storm, which is not necessarily what this place experienced.
  """
  categoryId: Int

  """
  Distance in miles from the place to the storm track, not to the edge of the wind swath.
  Never 0.
  """
  distanceToTrackMi: Float!

  """
  Areas the storm's winds covered, one per speed band, strongest first. This is the whole
  storm's wind field, not the part of it over this place. Null when the requested vintage
  does not carry this storm.
